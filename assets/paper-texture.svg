<svg xmlns="http://www.w3.org/2000/svg" width="400" height="600" viewBox="0 0 400 600">
  <defs>
    <filter id="fiber" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85 0.04" numOctaves="4" seed="12" result="noise"/>
      <feColorMatrix in="noise" type="matrix"
        values="0 0 0 0 0.93
                0 0 0 0 0.90
                0 0 0 0 0.84
                0 0 0 0.06 0"/>
      <feBlend in="SourceGraphic" in2="noise" mode="multiply"/>
    </filter>
    <pattern id="grain" width="80" height="80" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="18" r="0.6" fill="#c4a882" opacity="0.12"/>
      <circle cx="55" cy="42" r="0.5" fill="#b89870" opacity="0.1"/>
      <circle cx="38" cy="65" r="0.7" fill="#d0b890" opacity="0.08"/>
      <line x1="0" y1="40" x2="80" y2="41" stroke="#d8c4a8" stroke-width="0.3" opacity="0.15"/>
    </pattern>
  </defs>
  <rect width="400" height="600" fill="#f3ebe0"/>
  <rect width="400" height="600" fill="url(#grain)"/>
  <rect width="400" height="600" filter="url(#fiber)" opacity="0.55"/>
</svg>
